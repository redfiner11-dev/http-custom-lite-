                  val ctx = appContext
                  val libV2rayFile = if (ctx != null) File(ctx.applicationInfo.nativeLibraryDir, "libv2ray.so") else null
                  val canUseNativeXray = useV2ray && libV2rayFile != null && libV2rayFile.exists()

