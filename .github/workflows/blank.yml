name: Build Ultra-Light APK (Cloud Builder)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go (for Native SlowDNS & Xray-core)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Configure Pre-installed Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Complete Clean Project Files & Native Engines (libtun2socks + libdns + libv2ray)
        run: |
          mkdir -p /tmp/preserved_jni/arm64-v8a /tmp/preserved_jni/armeabi-v7a
          if [ -f app/src/main/jniLibs/arm64-v8a/libdns.so ]; then
            cp app/src/main/jniLibs/arm64-v8a/libdns.so /tmp/preserved_jni/arm64-v8a/libdns.so
          fi
          if [ -f app/src/main/jniLibs/armeabi-v7a/libdns.so ]; then
            cp app/src/main/jniLibs/armeabi-v7a/libdns.so /tmp/preserved_jni/armeabi-v7a/libdns.so
          fi

          rm -rf app core build .gradle
          mkdir -p app/src/main/java/com/kurdo/litevpn
          mkdir -p app/src/main/java/org/bugs4u/proxyserver/core
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          # 1. Extract Native BadVPN libtun2socks.so (arm64-v8a & armeabi-v7a from HTTP Custom)
          cat << 'EOF' | tr -d ' \n\r' | base64 -d | xz -d > app/src/main/jniLibs/arm64-v8a/libtun2socks.so
