          chmod 755 app/src/main/jniLibs/arm64-v8a/libtun2socks.so app/src/main/jniLibs/armeabi-v7a/libtun2socks.so

          # 2. Restore or Compile Native SlowDNS dnstt-client (libdns.so) for arm64-v8a & armeabi-v7a
          if [ -f /tmp/preserved_jni/arm64-v8a/libdns.so ] && [ -f /tmp/preserved_jni/armeabi-v7a/libdns.so ]; then
            cp /tmp/preserved_jni/arm64-v8a/libdns.so app/src/main/jniLibs/arm64-v8a/libdns.so
            cp /tmp/preserved_jni/armeabi-v7a/libdns.so app/src/main/jniLibs/armeabi-v7a/libdns.so
          else
            mkdir -p /tmp/dnstt-build && cd /tmp/dnstt-build
            go mod init dnsttbuilder
            GOPROXY=https://proxy.golang.org,direct go get www.bamsoftware.com/git/dnstt.git/dnstt-client@latest
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libdns.so" www.bamsoftware.com/git/dnstt.git/dnstt-client
            CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libdns.so" www.bamsoftware.com/git/dnstt.git/dnstt-client
            cd "$GITHUB_WORKSPACE"
          fi
          chmod 755 app/src/main/jniLibs/arm64-v8a/libdns.so app/src/main/jniLibs/armeabi-v7a/libdns.so || true

          # 3. Download Official Xray-core Native Binaries (libv2ray.so) supporting Reality, XTLS & gRPC
          mkdir -p /tmp/xray_arm64 /tmp/xray_arm32
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm64-v8a.zip -o /tmp/xray_arm64.zip
          unzip -q -o /tmp/xray_arm64.zip -d /tmp/xray_arm64
          cp /tmp/xray_arm64/xray "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libv2ray.so"

          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm32-v7a.zip -o /tmp/xray_arm32.zip
          unzip -q -o /tmp/xray_arm32.zip -d /tmp/xray_arm32
          cp /tmp/xray_arm32/xray "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libv2ray.so"
          chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libv2ray.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libv2ray.so"

          cat << 'EOF' > settings.gradle
          pluginManagement {
