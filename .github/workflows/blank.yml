                          }
                          backoffMs = 2000L
                      } catch (e: Exception) {
                          if (!running.get()) break
                          onLog("Tunnel error: ${e.message} (retry in ${backoffMs / 1000}s)")
                          onState("RECONNECTING", e.message ?: "Retrying")
                          try { Thread.sleep(backoffMs) } catch (_: Exception) {}
                          if (backoffMs < 20000L) backoffMs *= 2
