                  vpnNetMask: String,
                  socksServerAddress: String,
                  udpgwServerAddress: String,
                  dnsgwServerAddress: String,
                  udpgwTransparentDNS: Int
              ): Int

              @JvmStatic
              private external fun terminateTun2Socks(): Int
          }
